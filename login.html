<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cantina Escolar</title>
    <link rel="stylesheet" href="login-style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <h2>CANTINA ESCOLAR</h2>
            <p>Controle de Estoque • Painel de Acesso</p>
        </div>

        <form id="loginForm" onsubmit="validarLogin(event)">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="ana@cantina.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Entrar no Sistema</button>
            
            <div id="erro" class="error-message">E-mail ou senha incorretos!</div>
            <div class="cadastro-link">
            Não tem uma conta? <a href="cadastro.html" style="color: var(--azul-destaque); text-decoration: none; font-weight: 600;">Cadastre-se aqui</a>
        </div>
        </form>
    </div>

    <script>
    async function validarLogin(event) {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha');
        const erro = document.getElementById('erro');

        try {
            const resposta = await fetch('http://localhost:3000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });

            const dados = await resposta.json();

            if (resposta.ok && dados.sucesso) {
                erro.style.display = 'none';
                sessionStorage.setItem('usuarioLogado', JSON.stringify(dados.usuario));
                window.location.href = 'index.html';
            } else {
                erro.textContent = dados.mensagem || 'E-mail ou senha incorretos!';
                erro.style.display = 'block';
            }
        } catch (err) {
            alert('Erro ao conectar com o servidor backend.')
        }
    }
    </script>
</body>
</html>
