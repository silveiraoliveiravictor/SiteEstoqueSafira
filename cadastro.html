<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Cantina Escolar</title>
    <link rel="stylesheet" href="cadastro-style.css">
</head>
<body class="cadastro-body">
    
    <div class="cadastro-card">
        <div class="cadastro-header">
            <h2>CANTINA ESCOLAR</h2>
            <P>CRIAR NOVA CONTA DE ADMINISTRADOR</P>
    </div>

    <form id="cadastroForm">
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Ex: João Pereira" required>
        </div>
    
        <div class="form-group">
            <label for="email">E-mail Corporativo</label>
            <input type="email" id="email" placeholder="joao@cantina.com" required>
        </div>
    
        <div class="form-group">
            <label for="cargo">Cargo / Função</label>
            <select id="cargo">
                <option value="Operador">Operador de Caixa</option>
                <option value="Administrador">Administrador</option>
            </select>
        </div>
    
        <div class="form-group">
            <label for="senha">Senha de Acesso</label>
            <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required>
        </div>
    
        <button type="submit" class="btn-cadastro">Cadastrar Operador</button>
        
        <div class="login-link">
            Já tem uma conta? <a href="login.html">Fazer Login</a>
        </div>
    </form>

    <script>
    document.getElementById('cadastroForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const nome = document.getElementById('nome').value;
        const email = document.getElementById('email').value;
        const cargo = document.getElementById('cargo').value;
        const senha = document.getElementById('senha').value;

        try{
            const resposta = await fetch('http://localhost:3000/api/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, cargo, senha })
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                alert('Usuário cadastrado com sucesso! Redirecionando...');
                window.location.href = 'login.html';
            } else {
                alert(dados.mensagem || 'Erro ao realizar cadastro.');
            }
        } catch {
            alert('Erro ao conectar com o servidor backend.');
        }
    });
    </script>

</body>
</html>
